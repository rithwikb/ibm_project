[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-team"
version = "0.1.0"
description = "Multi-agent AI software development team orchestration system powered by Groq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.9.0",
    "streamlit",
    "pydantic",
    "python-dotenv",
    "plotly",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "core*", "dashboard*"]
